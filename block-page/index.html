<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Blocked</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1d29 0%, #0f1115 100%);
      color: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1f2230;
      border: 1px solid #2a2e3f;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon { font-size: 48px; line-height: 1; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .subtitle { margin: 0 0 24px; color: #9aa0b4; font-size: 15px; }
    .domain-box {
      background: #14161e;
      border: 1px solid #2a2e3f;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 14px;
      word-break: break-all;
    }
    .domain-label { color: #6b7290; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; color: #c5c8d4; }
    input, textarea {
      width: 100%;
      background: #14161e;
      border: 1px solid #2a2e3f;
      border-radius: 8px;
      padding: 12px;
      color: #e8eaed;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: #4f7cff; }
    textarea { min-height: 100px; }
    button {
      width: 100%;
      background: #4f7cff;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #3d6bee; }
    button:disabled { background: #3a3f55; cursor: not-allowed; }
    .success {
      background: #163a2a;
      border: 1px solid #1f5c43;
      color: #6ee7b7;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
    .error {
      background: #3a1620;
      border: 1px solid #5c1f30;
      color: #ff8fa3;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
    }
    .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #6b7290; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>This site is blocked</h1>
    <p class="subtitle">Access to this website is restricted by your organization's policy.</p>

    <div id="form-section">
      <div class="domain-box">
        <div class="domain-label">Domain</div>
        <div id="domain-display">—</div>
      </div>

      <form id="request-form">
        <label for="domain-input">Domain (edit if incorrect)</label>
        <input id="domain-input" type="text" required placeholder="example.com" />

        <label for="reason" style="margin-top:16px;">Why do you need access to this site?</label>
        <textarea id="reason" required placeholder="e.g. I need this for a work project..."></textarea>

        <button type="submit" id="submit-btn">Request Access</button>
        <div id="error" class="error" style="display:none;"></div>
      </form>
    </div>

    <div id="success-section" style="display:none;">
      <div class="success">
        ✓ Your request has been sent to your administrator.<br />
        You'll be notified once it's reviewed.
      </div>
    </div>

    <div class="footer">Filter</div>
  </div>

  <script>
    const API_BASE = window.FILTER_API_BASE || 'http://localhost:4000';

    function getProfileId() {
      return new URLSearchParams(location.search).get('profile') || '';
    }

    function guessDomain() {
      const params = new URLSearchParams(location.search);
      const fromParam = params.get('domain') || params.get('host');
      if (fromParam) return fromParam;
      try {
        if (document.referrer) return new URL(document.referrer).hostname;
      } catch {}
      return '';
    }

    document.getElementById('domain-display').textContent = guessDomain() || 'Unknown — please type below';
    document.getElementById('domain-input').value = guessDomain();

    document.getElementById('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const profile = getProfileId();
      const domain = document.getElementById('domain-input').value.trim();
      const reason = document.getElementById('reason').value.trim();

      if (!profile) {
        errorEl.textContent = 'Missing profile id in URL. This page must be opened from the block redirect.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Request Access';
        return;
      }

      try {
        const res = await fetch(API_BASE + '/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile_id: profile, domain, reason }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Request failed (${res.status})`);
        }
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Request Access';
      }
    });
  </script>
</body>
</html>
