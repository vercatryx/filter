# Part of proxy-filter module — see /proxy-filter/README.md

# ==========================================================================
# SSL Bump (HTTPS inspection)
# Squid terminates the client's TLS using a per-host certificate it generates
# on the fly, signed by our CA. The CA cert must be installed as a trusted
# root on every device that connects through this proxy — that's what the
# .mobileconfig profile does for macOS/iOS.
# ==========================================================================
http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=4MB \
  cert=/etc/squid/ssl/ca.crt \
  key=/etc/squid/ssl/ca.key

# Step 1: peek at the TLS handshake (SNI). Step 2/3: bump (decrypt) so we
# can apply ACLs to the inner request URL, not just the destination IP.
ssl_bump peek step1
ssl_bump bump step2
ssl_bump bump step3

# Storage for dynamically generated server certificates.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 5

# ==========================================================================
# Authentication
# Basic auth backed by an htpasswd-style flat file. Required on every
# request — no anonymous access. Each user gets their own line in /etc/squid/passwd.
# ==========================================================================
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Proxy
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive on

acl authenticated proxy_auth REQUIRED

# ==========================================================================
# Standard safe-port ACLs (HTTP/S only).
# ==========================================================================
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# ==========================================================================
# CONNECT method (HTTPS tunneling) — allow for authenticated users.
# ==========================================================================
http_access allow CONNECT authenticated

# ==========================================================================
# Blocklist
# A shared blocklist file with one domain per line. Update by editing the
# file and reloading Squid: `docker exec proxy-filter-squid squid -k reconfigure`.
# ==========================================================================
acl blocked_domains dstdomain "/etc/squid/blocklists/adult.txt"

# Per-user allowlist override. When an admin approves an access request, the
# admin API appends the approved domain to /etc/squid/allowlists/{user_id}.txt
# and runs `squid -k reconfigure`. Below we register one ACL per known user
# allowlist file. If you add new users you must update this section AND
# reconfigure squid.
#
# Example for one user:
#   acl user_alice proxy_auth alice
#   acl alice_allowed dstdomain "/etc/squid/allowlists/alice.txt"
#   http_access allow user_alice alice_allowed
#
# To keep this config simple by default, we use a single shared allowlist.
# When per-user allowlists are added, replace this with the pattern above.
acl global_allowed dstdomain "/etc/squid/allowlists/global.txt"
http_access allow global_allowed authenticated

# Redirect blocked-domain hits to the block page.
deny_info http://blocked.yourplatform.com/?domain=%H&user=%un blocked_domains

# Deny matching the blocklist (after allowlist is checked above).
http_access deny blocked_domains authenticated

# ==========================================================================
# Default policy
# Allow remaining authenticated traffic, deny everything else.
# ==========================================================================
http_access allow authenticated
http_access deny all

# ==========================================================================
# Logging
# Combined-style log including authenticated username (%un).
# ==========================================================================
logformat combined %>a %ui %un [%tl] "%rm %ru HTTP/%rv" %>Hs %<st "%{Referer}>h" "%{User-Agent}>h" %Ss:%Sh
access_log /var/log/squid/access.log combined

# ==========================================================================
# Performance
# ==========================================================================
cache_mem 256 MB
maximum_object_size 50 MB
coredump_dir /var/spool/squid

# Refresh patterns (defaults, kept for completeness).
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
