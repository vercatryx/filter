# Auto-generated by setup-server-mac.sh.
# pf rules to:
#   - NAT outbound traffic from VPN clients (10.10.10.0/24) so it leaves
#     with our public IP
#   - Redirect VPN-egress TCP/80 + TCP/443 into mitmproxy on 127.0.0.1:8080
#   - Drop UDP/443 (QUIC) from VPN clients so browsers fall back to TCP
#
# Loaded by the LaunchDaemon at /Library/LaunchDaemons/com.proxyfilter.pf.plist.

# Egress interface — auto-detected by setup script and substituted in.
egress_if = "{{EGRESS_IF}}"

# VPN client subnet (matches `rightsourceip` block in ipsec.conf).
vpn_clients = "10.10.10.0/24"

# === NAT ============================================================
# Make outbound traffic from VPN clients look like it came from us.
nat on $egress_if inet from $vpn_clients to any -> ($egress_if)

# === Redirects ======================================================
# Steal HTTP/HTTPS from VPN clients into mitmproxy.
rdr pass inet proto tcp from $vpn_clients to any port 443 -> 127.0.0.1 port 8080
rdr pass inet proto tcp from $vpn_clients to any port  80 -> 127.0.0.1 port 8080

# === Filter =========================================================
# Drop UDP/443 (QUIC) from VPN clients — browsers fall back to TCP/443
# (which we MITM via the redirect above).
block drop quick proto udp from $vpn_clients to any port 443

# Default-pass everything else (we rely on macOS's existing firewall
# posture for the host itself).
pass all
