# Auto-loaded by setup-server-vps.sh as /etc/nftables.d/proxy-filter.nft.
# Equivalent of the macOS pf.conf file in this same directory:
#   - NAT outbound traffic from VPN clients (10.10.10.0/24) so it leaves
#     with our public IP
#   - Redirect VPN-egress TCP/80 + TCP/443 into mitmproxy on 127.0.0.1:8080
#   - Drop UDP/443 (QUIC) from VPN clients so browsers fall back to TCP
#
# Egress interface auto-detected by setup-server-vps.sh and substituted in
# the {{EGRESS_IF}} placeholder before this file is dropped into /etc/.

table inet proxyfilter {
    set vpn_clients {
        type ipv4_addr
        flags interval
        elements = { 10.10.10.0/24 }
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Steal HTTP/HTTPS from VPN clients into mitmproxy (transparent proxy).
        ip saddr @vpn_clients tcp dport 443 redirect to :8080
        ip saddr @vpn_clients tcp dport  80 redirect to :8080
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # NAT outbound traffic from VPN clients to our public IP.
        ip saddr @vpn_clients oifname "{{EGRESS_IF}}" masquerade
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        # Drop UDP/443 (QUIC) so browsers fall back to TCP/443 (we MITM that).
        ip saddr @vpn_clients udp dport 443 drop
    }
}
